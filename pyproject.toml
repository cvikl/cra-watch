[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-watch"
version = "0.1.0"
description = "CRA Watch: autonomous EU Cyber Resilience Act Article 14 agent on Nebius, NVIDIA Nemotron, Tavily and Origit."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "openai>=1.50",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "origit",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cra-watch = "crawatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawatch*"]

[tool.setuptools.package-data]
crawatch = ["templates/*", "static/*", "static/vendor/*", "static/fonts/*", "prompts/*"]

[tool.uv.sources]
origit = { path = "vendor/origit" }
