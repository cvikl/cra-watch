<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRA Watch</title>
<meta name="description" content="Autonomous EU Cyber Resilience Act Article 14 agent: Tavily monitors, Origit traces, Nemotron on Nebius classifies and drafts, a person approves.">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="band" role="banner">
  <a class="brand" href="/" aria-label="CRA Watch home">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 7v9l6 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg>
    <span class="brand-name">CRA Watch</span>
    <span class="brand-sub">Article 14 early-warning console</span>
  </a>
  <div class="band-product">
    <span class="label">Manufacturer</span><span id="manufacturer" class="value">…</span>
    <span class="label">Product</span><span id="product" class="value">{{ product }}</span>
  </div>
  <ul class="systems" id="systems" aria-label="Connected systems"></ul>
</header>

<div class="desk">
  <aside class="register" aria-label="Register">
    <section class="reg-block">
      <div class="reg-head">
        <h2>Watched dependencies</h2>
        <button class="btn btn-ghost" id="btn-monitor" title="Poll the advisory feeds through Tavily now">Poll feeds</button>
      </div>
      <ol class="watch" id="watchlist"></ol>
      <p class="reg-note" id="monitor-note"></p>
    </section>
    <section class="reg-block">
      <div class="reg-head">
        <h2>Sentinel checks</h2>
        <button class="btn btn-ghost" id="btn-sentinel" title="Scan every agent commit in the Origit store with Nemotron Nano">Run scan</button>
      </div>
      <p class="reg-note" id="sentinel-note"></p>
      <ol class="commits" id="commits"></ol>
    </section>
    <section class="reg-block journal-block">
      <div class="reg-head"><h2>Journal</h2><span class="live" id="live-dot" title="Live event stream">live</span></div>
      <ol class="journal" id="journal" aria-live="polite"></ol>
    </section>
  </aside>

  <main class="report" id="report" aria-live="polite"></main>
</div>

<template id="tpl-empty">
  <article class="doc">
    <header class="doc-head">
      <div class="doc-no"><span class="label">Document</span><span class="value">Pre-incident checks</span></div>
      <div class="doc-status"><span class="stamp stamp-quiet">No open incident</span></div>
    </header>
    <section class="fields fields-3">
      <div class="field"><span class="label">Monitor</span><span class="value" data-k="monitor"></span></div>
      <div class="field"><span class="label">Sentinel coverage</span><span class="value" data-k="coverage"></span></div>
      <div class="field"><span class="label">Risk flags</span><span class="value" data-k="flags"></span></div>
    </section>
    <section class="doc-section">
      <h3 class="sec-title"><span class="sec-no">1</span>How an incident is handled</h3>
      <ol class="ladder" data-k="ladder"></ol>
    </section>
    <section class="doc-section" data-k="commit-detail"></section>
  </article>
</template>

<script src="/static/app.js" defer></script>
</body>
</html>
