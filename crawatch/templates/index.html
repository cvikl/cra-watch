<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRA Watch</title>
<meta name="description" content="Autonomous EU Cyber Resilience Act Article 14 agent: Tavily monitors, Origit traces, Nemotron on Nebius classifies and drafts, a person approves.">
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/mark.svg">
<meta name="theme-color" content="#f6f8fa">
<link rel="preload" href="/static/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/onest.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="band" role="banner">
  <a class="brand" href="/" aria-label="CRA Watch, part of the Origit console">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="M16 3v8.5M16 20.5V29M3 16h8.5M20.5 16H29" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span class="brand-name">Origit <span>Console</span></span>
    <span class="brand-sub">CRA Watch · Article 14 early warning</span>
  </a>
  <div class="band-product">
    <span class="label">Manufacturer</span><span id="manufacturer" class="value">…</span>
    <span class="label">Product</span><span id="product" class="value">{{ product }}</span>
  </div>
  <ul class="systems" id="systems" aria-label="Connected systems"></ul>
  <a class="band-clock" id="band-clock" href="#report" hidden><span class="bc-no"></span><span class="bc-time num"></span><span class="bc-label"></span></a>
</header>

<div class="desk">
  <aside class="register" aria-label="Register">
    <section class="reg-block">
      <div class="reg-head">
        <h2>Watched dependencies</h2>
        <button class="btn btn-ghost" id="btn-monitor" title="Poll the advisory feeds through Tavily now">Poll feeds</button>
      </div>
      <ol class="watch" id="watchlist"></ol>
      <p class="reg-note" id="monitor-note"></p>
    </section>
    <section class="reg-block">
      <div class="reg-head">
        <h2>Sentinel checks</h2>
        <button class="btn btn-ghost" id="btn-sentinel" title="Scan every agent commit in the Origit store with Nemotron Nano">Run scan</button>
      </div>
      <p class="reg-note" id="sentinel-note"></p>
      <ol class="legend" aria-label="Risk scale"><li><span class="scale" data-risk="low"><i></i><i></i><i></i><i></i></span>low</li><li><span class="scale" data-risk="medium"><i></i><i></i><i></i><i></i></span>medium</li><li><span class="scale" data-risk="high"><i></i><i></i><i></i><i></i></span>high</li><li><span class="scale" data-risk="critical"><i></i><i></i><i></i><i></i></span>critical</li></ol>
      <ol class="commits" id="commits"></ol>
    </section>
    <section class="reg-block journal-block">
      <div class="reg-head"><h2>Journal</h2><span class="live" id="live-dot" title="Live event stream">live</span></div>
      <ol class="journal" id="journal"></ol>
    </section>
  </aside>

  <main class="report" id="report"></main>
</div>

<template id="tpl-empty">
  <article class="doc">
    <header class="doc-head">
      <div class="doc-no"><h1 class="value">Pre-incident checks</h1><span class="sub">Sentinel register and advisory watch, before any incident</span></div>
      <div class="doc-status"><span class="stamp stamp-quiet">No open incident</span></div>
    </header>
    <section class="fields fields-3">
      <div class="field"><span class="label">Monitor</span><span class="value" data-k="monitor"></span></div>
      <div class="field"><span class="label">Sentinel coverage</span><span class="value" data-k="coverage"></span></div>
      <div class="field"><span class="label">Risk flags</span><span class="value" data-k="flags"></span></div>
    </section>
    <section class="doc-section">
      <h2 class="sec-title"><span class="sec-no">1</span>How an incident is handled</h2>
      <ol class="ladder" data-k="ladder"></ol>
    </section>
    <section class="doc-section" data-k="commit-detail"></section>
  </article>
</template>

<script src="/static/app.js" defer></script>
</body>
</html>
